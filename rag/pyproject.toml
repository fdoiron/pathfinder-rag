[project]
name = "rag"
version = "0.1.0"
description = "RAG pipeline for Pathfinder 1e rules. parsing, embedding, retrieval, and eval"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "transformers>=5.14.1",
    "typer>=0.26.8",
    "sentence-transformers>=2.7.0",
    "torch>=2.1.0",
    "openai>=2.48.0",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.uv]
package = true

[dependency-groups]
dev = [
    "huggingface-hub>=1.23.0",
    "ipykernel>=7.3.0",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "poethepoet>=0.30.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "types-lxml>=2026.2.16",
]

[tool.hatch.build.targets.wheel]
packages = ['src/rag']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'A', 'UP', 'SIM', 'RUF', 'C4', 'PTH', 'PT', 'PD', 'ARG']

[tool.ruff.lint.per-file-ignores]
# renderer callbacks share a fixed (element, content) interface
"src/rag/parsing.py" = ['ARG001']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
plugins = ['pydantic.mypy']

# tests use untyped/loosely-typed fixtures and fakes on purpose
[[tool.mypy.overrides]]
module = ['test_answer', 'test_chunking', 'test_cli', 'test_corpus', 'test_embedding', 'test_evaluation', 'test_lexical', 'test_parsing', 'test_retrieval']
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['gpu: needs a GPU and downloaded model weights']
addopts = '-m "not gpu"'

[project.scripts]
rag = 'rag.cli:app'

[tool.poe.tasks]
lint = 'ruff check .'
fmt = 'ruff format .'
fmt-check = 'ruff format --check .'
typecheck = 'mypy src tests'
test = 'pytest -v'
check = ['lint', 'fmt-check', 'typecheck', 'test']
