[project]
name = "pathfinder-agent"
version = "0.1.0"
description = "MCP agent client for the Pathfinder 1e RAG server"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0",
    "openai>=2.48.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "typer>=0.26.8",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "poethepoet>=0.30.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ['src/pathfinder_agent']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'A', 'UP', 'SIM', 'RUF', 'C4', 'PTH', 'PT', 'PD', 'ARG']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['llm: needs a live LLM server (Ollama) and makes a real model call']
addopts = '-m "not llm"'

[tool.poe.tasks]
lint = 'ruff check .'
fmt = 'ruff format .'
fmt-check = 'ruff format --check .'
typecheck = 'mypy src tests'
test = 'pytest -v'
check = ['lint', 'fmt-check', 'typecheck', 'test']
