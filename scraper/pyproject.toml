[project]
name = "scraper"
version = "0.1.0"
description = "Scrapy crawler that downloads Pathfinder 1e rules pages from d20pfsrd.com"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scrapy>=2.16.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.3.260530",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.32.0",
    "requests-cache>=1.3.3",
    "ruff>=0.15.20",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 120
# notebooks are exploration history not production code. don't lint
extend-exclude = ['*.ipynb']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'A', 'UP', 'SIM', 'RUF']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ['test_spiders']
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']

[tool.poe.tasks]
lint = 'ruff check .'
fmt = 'ruff format .'
typecheck = 'mypy pathfinder_scraper discover_urls.py tests'
test = 'pytest -v'
check = ['lint', 'fmt', 'typecheck', 'test']
